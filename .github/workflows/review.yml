name: review

# 同じリポジトリの PR は自動。フォークの PR は、メンテナが中身を見て `review` ラベルを付けたときだけ
# (フォークには pull_request で secret が渡らないため pull_request_target を使う)
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      !github.event.pull_request.draft && (
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'pull_request_target' && github.event.label.name == 'review' && github.event.pull_request.head.repo.full_name != github.repository)
      )
    runs-on: ubuntu-latest
    steps:
      # ref を指定しない。pull_request_target では base ブランチになり、PR のコードは checkout も実行もしない
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # Claude Code を Kimi Code の Anthropic 互換エンドポイントへ向けて動かす
      - uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://api.kimi.ai/coding/
          ANTHROPIC_MODEL: kimi-for-coding
          ANTHROPIC_DEFAULT_FABLE_MODEL: kimi-for-coding
          ANTHROPIC_DEFAULT_OPUS_MODEL: kimi-for-coding
          ANTHROPIC_DEFAULT_SONNET_MODEL: kimi-for-coding
          ANTHROPIC_DEFAULT_HAIKU_MODEL: kimi-for-coding
          CLAUDE_CODE_SUBAGENT_MODEL: kimi-for-coding
          # Bash ツールの子プロセスから KIMI_API_KEY などを消す。PR 経由のプロンプトインジェクションで
          # `gh pr comment "$ANTHROPIC_API_KEY"` のように展開させても空になる (allowed_non_write_users 未設定だと既定で無効)
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: 1
        with:
          anthropic_api_key: ${{ secrets.KIMI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            この PR をレビューしてください。バグ、競合状態、エラー処理の漏れ、
            セキュリティ上の問題を優先し、スタイルの好みは指摘しないでください。
            指摘はファイル名と行番号を添えて、`gh pr comment` で1件のコメントにまとめ、
            日本語で書いてください。
            問題がなければ短くそう書くだけで構いません。
          claude_args: |
            --model kimi-for-coding
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
      # 外して終わるので、フォーク側が push し直した後は付け直せば再レビューされる
      - name: review ラベルを外す
        if: always() && github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit ${{ github.event.pull_request.number }} -R ${{ github.repository }} --remove-label review
