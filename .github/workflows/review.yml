name: review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      # Claude Code を Kimi Code の Anthropic 互換エンドポイントへ向けて動かす
      - uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://api.kimi.ai/coding/
          ANTHROPIC_MODEL: kimi-for-coding
          ANTHROPIC_DEFAULT_FABLE_MODEL: kimi-for-coding
          ANTHROPIC_DEFAULT_OPUS_MODEL: kimi-for-coding
          ANTHROPIC_DEFAULT_SONNET_MODEL: kimi-for-coding
          ANTHROPIC_DEFAULT_HAIKU_MODEL: kimi-for-coding
          CLAUDE_CODE_SUBAGENT_MODEL: kimi-for-coding
        with:
          anthropic_api_key: ${{ secrets.KIMI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            この PR をレビューしてください。バグ、競合状態、エラー処理の漏れ、
            セキュリティ上の問題を優先し、スタイルの好みは指摘しないでください。
            具体的な行への指摘は mcp__github_inline_comment__create_inline_comment で、
            全体のまとめは `gh pr comment` で、日本語で書いてください。
            問題がなければ短くそう書くだけで構いません。
          claude_args: |
            --model kimi-for-coding
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
